name: Frontend

on:
  pull_request:
    branches: [develop, main]

defaults:
  run:
    working-directory: frontend

jobs:
  checks:
    name: ESLint + Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: |
          if npm run | grep -q ' lint'; then npm run lint; else echo "::warning::script 'lint' no configurado en frontend/package.json"; fi
      - name: Jest
        run: |
          if npm run | grep -q ' test'; then npm test -- --ci; else echo "::warning::script 'test' (Jest) no configurado en frontend/package.json"; fi
